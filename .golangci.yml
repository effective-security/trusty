version: "2"
linters:
  settings:
    errcheck:
      exclude-functions:
        - fmt.Sscanf
        - (*github.com/olekukonko/tablewriter.Table).Append
        - (*github.com/olekukonko/tablewriter.Table).Render
    govet:
      disable:
        - inline
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: (.+)\.go$
        text: SA1016
      - path: (.+)\.go$
        text: SA1019
      - path: (.+)\.go$
        text: QF1003
    paths:
      - ".*_test\\.go$"
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - ".*_test\\.go$"
      - third_party$
      - builtin$
      - examples$
